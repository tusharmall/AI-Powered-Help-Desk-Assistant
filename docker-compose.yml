services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-helpdesk-postgres
    environment:
      POSTGRES_DB: helpdesk_ai
      POSTGRES_USER: helpdesk
      POSTGRES_PASSWORD: helpdesk
    ports:
      - "5432:5432"
    volumes:
      - helpdesk_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helpdesk -d helpdesk_ai"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:latest
    container_name: ai-helpdesk-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  helpdesk_postgres_data: