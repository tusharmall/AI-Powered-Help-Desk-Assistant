<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Help Desk Assistant</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 900px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; min-height: 130px; padding: 12px; }
    button { margin-top: 12px; padding: 10px 18px; cursor: pointer; }
    pre { white-space: pre-wrap; background: #f5f5f5; padding: 16px; min-height: 180px; }
    .hint { color: #666; }
  </style>
</head>
<body>
  <h1>AI Help Desk Assistant</h1>
  <p class="hint">Try: “My VPN is not connecting and I get authentication failures. My email is tushar@example.com.”</p>
  <textarea id="query" placeholder="Describe your issue..."></textarea>
  <br />
  <button onclick="sendQuery()">Ask Assistant</button>
  <button onclick="reindex()">Reindex Knowledge</button>
  <h3>Response</h3>
  <pre id="response"></pre>

  <script>
    const conversationId = localStorage.getItem('conversationId') || crypto.randomUUID();
    localStorage.setItem('conversationId', conversationId);

    async function sendQuery() {
      const query = document.getElementById('query').value;
      document.getElementById('response').textContent = 'Thinking...';
      const response = await fetch('/api/v1/ai/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain', 'ConversationId': conversationId },
        body: query
      });
      document.getElementById('response').textContent = await response.text();
    }

    async function reindex() {
      const response = await fetch('/api/v1/knowledge/reindex', { method: 'POST' });
      document.getElementById('response').textContent = await response.text();
    }
  </script>
</body>
</html>
